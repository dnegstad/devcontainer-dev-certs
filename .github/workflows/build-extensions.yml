name: Build Extensions

on:
  workflow_call:
    inputs:
      production:
        description: Use production build (minified, no sourcemaps)
        type: boolean
        default: false
      upload-artifacts:
        description: Package and upload release artifacts (VSIXes) for downstream publish jobs.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extensions:
    name: Build & Test Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Set up .NET 10 SDK
        # Required by tests/dotnetPfx.integration.test.ts: builds a tiny
        # console harness that loads our generated PFX via .NET's modern
        # PKCS#12 path (X509CertificateLoader.LoadPkcs12). Without this
        # step the test self-skips and we get no .NET interop coverage.
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Install system dependencies for integration tests
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends libnss3-tools

      - name: Install dependencies
        run: npm ci

      # esbuild (build) and vitest (test) both strip types without
      # checking them, so a dedicated tsc pass per workspace is the only
      # thing that gates type errors at PR time.
      - name: Typecheck Shared
        run: npm run typecheck -w src/shared

      - name: Typecheck UI Extension
        run: npm run typecheck -w src/vscode-ui-extension

      - name: Typecheck Workspace Extension
        run: npm run typecheck -w src/vscode-workspace-extension

      - name: Build UI Extension
        run: npm run ${{ inputs.production && 'build:prod' || 'build' }} -w src/vscode-ui-extension

      - name: Test UI Extension
        run: npm test -w src/vscode-ui-extension

      - name: Build Workspace Extension
        run: npm run ${{ inputs.production && 'build:prod' || 'build' }} -w src/vscode-workspace-extension

      - name: Test Workspace Extension
        run: npm test -w src/vscode-workspace-extension

      - name: Package UI Extension VSIX
        run: npm run package -w src/vscode-ui-extension

      - name: Package Workspace Extension VSIX
        run: npm run package -w src/vscode-workspace-extension

      - name: Upload VSIX artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: src/vscode-*-extension/*.vsix

  vscode-e2e:
    # Deliberately a separate job from `extensions`, not a step inside it.
    # This one is the only thing in CI that downloads a VS Code build at run
    # time, so it is also the only thing that can fail for reasons that have
    # nothing to do with the code (update.code.visualstudio.com being down, a
    # slow CDN, a runner with no egress). Keeping it separate means such a
    # failure shows up as "vscode-e2e red, extensions green" instead of
    # masking — or being mistaken for — a real unit-test regression.
    name: VS Code E2E (spike)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # esbuild/vitest never typecheck; the E2E sources sit outside every
      # workspace tsconfig, so they need their own pass like the others do.
      - name: Typecheck E2E suite
        run: npm run typecheck:e2e

      # The suite loads the extensions' real bundles via
      # --extensionDevelopmentPath, so `dist/extension.js` has to exist for
      # both. Never the production build: the remote-gate seam the suite
      # depends on is only honored outside ExtensionMode.Production, and a
      # minified bundle makes failures unreadable for no benefit here.
      - name: Build UI Extension
        run: npm run build -w src/vscode-ui-extension

      - name: Build Workspace Extension
        run: npm run build -w src/vscode-workspace-extension

      - name: Build E2E suite
        run: npm run build:e2e

      - name: Generate test certificate fixture
        run: npm run gen:test-cert

      # VS Code is an Electron app and needs an X server even with
      # --disable-gpu. `xvfb-run -a` picks a free display number.
      - name: Run VS Code E2E suite
        run: xvfb-run -a npm run test:e2e

  windows-certificate-validation:
    name: Windows Certificate Validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci

      - name: Build UI Extension
        run: npm run ${{ inputs.production && 'build:prod' || 'build' }} -w src/vscode-ui-extension

      - name: Validate PFX import with Windows CryptoAPI
        # CurrentUser\Root and macOS trust both require interactive trust
        # prompts, so CI validates Windows against LocalMachine stores only.
        env:
          DEVCERTS_WINDOWS_STORE_INTEGRATION: "1"
        run: npm test -w src/vscode-ui-extension -- tests/windowsStore.integration.test.ts

      - name: Set up .NET 10 SDK
        # Required only by tests/dotnetPfx.integration.test.ts, which validates
        # .NET's managed PKCS#12 loader and private-key attachment.
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Validate PFX with .NET
        run: npm test -w src/vscode-ui-extension -- tests/dotnetPfx.integration.test.ts

  macos-dotnet-dev-certs-cache:
    name: macOS dotnet dev-certs disk-cache compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build UI Extension
        run: npm run ${{ inputs.production && 'build:prod' || 'build' }} -w src/vscode-ui-extension

      - name: Set up .NET 10 SDK
        # Test invokes `dotnet dev-certs https` to produce the actual
        # on-disk cache file aspnetcore's MacOSCertificateManager
        # writes. We need a real SDK on PATH; the exact major version
        # is logged so we can correlate the result with SDK behavior
        # if aspnetcore changes its export defaults.
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Unlock login keychain for dotnet dev-certs
        # `dotnet dev-certs https` saves the generated cert into
        # CurrentUser\My, which on macOS is the login keychain. GitHub
        # Actions macos runners ship with the login keychain locked
        # by default — without an unlock, the save call fails with
        # "There was an error saving the HTTPS developer certificate
        # to the current user personal certificate store." and the
        # disk cache we're trying to test never gets written.
        #
        # The empty password is the documented GH Actions convention
        # for the runner user's login keychain.
        run: |
          security unlock-keychain -p '' "$HOME/Library/Keychains/login.keychain-db"
          security set-keychain-settings "$HOME/Library/Keychains/login.keychain-db"

      - name: Validate dotnet dev-certs disk cache is loadable
        # If this fails, the dotnet backend on macOS cannot discover
        # the cert dotnet just created — platform-store discovery
        # depends on `parsePfx` accepting whatever
        # `certificate.Export(X509ContentType.Pfx)` writes on macOS.
        # The same test pins the on-disk PBE algorithm OID so we get
        # a loud signal the day aspnetcore switches to PBES2 and the
        # legacy 3DES handler in `pkcs12LegacyPbe.ts` can be removed.
        run: npm test -w src/vscode-ui-extension -- tests/dotnetMacosCache.integration.test.ts

  feature:
    name: Validate Devcontainer Feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Validate feature metadata and consistency
        run: node test/validate-feature.mjs

      - name: Validate feature schema (devcontainers/action)
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          validate-only: "true"
          base-path-to-features: src/devcontainer-feature/src

      - name: Shellcheck install.sh
        run: shellcheck src/devcontainer-feature/src/devcontainer-dev-certs/install.sh

      - name: Shellcheck setup-cert.sh
        run: shellcheck src/devcontainer-feature/src/devcontainer-dev-certs/scripts/setup-cert.sh
